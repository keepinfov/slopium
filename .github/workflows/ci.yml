name: ci

# `main` is only ever updated through a pull request, so a branch is checked on
# the pull request and `main` is checked again after the merge. Pushing a branch
# without one runs nothing, which is deliberate: a branch nobody has proposed is
# not asking a question.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The version invariants of AGENTS.md §7: the manifest, the lockfile, the
  # flake and the committed consumer's lock all say the same number. Seconds,
  # and it is the check whose failure is only ever discovered at a release.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/release-check.sh --check

  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: scripts/runtime-check.sh
        env:
          SLOPIUM_ASAN_DETECT_LEAKS: "1"

  projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/project-tests.sh

  # The whole of scripts/verify.sh, inside the dev shell that carries every tool
  # it looks for — including an aarch64 toolchain whose binaries are named the
  # way the suite expects. SLOPIUM_STRICT=1 turns any skip into a failure, so
  # this job cannot pass by finding nothing. It ends with `nix flake check`,
  # which is why there is no separate nix job.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - env:
          SLOPIUM_STRICT: "1"
          SLOPIUM_ASAN_DETECT_LEAKS: "1"
        run: nix develop --command scripts/verify.sh

  # The commit contract of AGENTS.md, over the commits this event adds and no
  # others: the history before v0.4 predates the contract and would fail it.
  # Merges are included — the one that lands a pull request carries its title,
  # which is a subject like any other.
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check the commit contract
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..$HEAD_SHA"
          else
            range="$HEAD_SHA~1..$HEAD_SHA"
          fi
          echo "checking $range"
          scripts/commit-check.sh "$range"

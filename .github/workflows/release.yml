name: release

# What a `v*` tag does. `AGENTS.md` §7 says pushing the tag publishes the
# release; this is that, and it publishes a **draft**: a person looks at the
# asset list and presses the button, because a release is the one thing in this
# repository that another commit cannot undo.
#
# `workflow_dispatch` rehearses it against the ref it is started from and
# publishes nothing, which is how a change to this file is tested. It cannot
# rehearse against an existing tag: this job checks out the tree being released,
# and every tag up to `v0.9.2` predates `scripts/release-check.sh` and
# `CHANGELOG.md`, so the first attempt failed with `No such file or directory`.
# Verifying a release with the code being released is the behaviour worth
# keeping, so the rehearsal moved rather than the checkout.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap, and everything else depends on it. A tag that disagrees with the
  # manifest, or a version with nothing written under it in the changelog, is a
  # release that should not start rather than one to cancel half-built.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: the tag, the manifest and the changelog agree
        # A ${{ }} expression is pasted in before the shell parses the script,
        # so a tag name would be shell source rather than data. It goes through
        # the environment instead, here and below.
        #
        # A rehearsal asks for `--check` rather than `--check-release`, because
        # the release-only half is a statement about a release commit — the tag
        # names this version, its changelog section is dated, `[Unreleased]` has
        # been emptied into it — and none of that is true of a branch that is
        # still collecting entries. What the rehearsal is for is everything
        # below this job, which no pull request runs.
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT" = push ]; then
            scripts/release-check.sh --check-release "$TAG"
            case "$TAG" in
              *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            scripts/release-check.sh --check
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$(scripts/release-check.sh)" >> "$GITHUB_OUTPUT"

      - name: the lockfile matches the manifests
        run: cargo metadata --locked --format-version 1 > /dev/null

  # The same suite `main` is held to, at the commit being released. It is the
  # slow job and it gates the publish rather than the build, so an artifact is
  # ready to look at while it finishes.
  suite:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - env:
          SLOPIUM_STRICT: "1"
          SLOPIUM_ASAN_DETECT_LEAKS: "1"
        run: nix develop --command scripts/verify.sh

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release --workspace --locked

      # Three programs and the completions they generate. The C runtime and the
      # bundled library are compiled into the binaries rather than shipped
      # beside them, so an archive of `bin/` is a working toolchain.
      - name: stage the archive
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -eux
          name="slopium-$VERSION-x86_64-linux"
          mkdir -p "staging/$name/bin" "staging/$name/completions"
          cp target/release/slopic target/release/slopium \
             target/release/slopium-lsp "staging/$name/bin/"
          for shell in bash zsh fish; do
            target/release/slopium completions "$shell" \
              > "staging/$name/completions/slopium.$shell"
          done
          cp LICENSE README.md CHANGELOG.md "staging/$name/"
          tar -C staging -czf "$name.tar.gz" "$name"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"

      # An archive that cannot compile a program is a failure that looks like a
      # success, and it has to be caught here rather than by whoever downloads
      # it first.
      - name: the staged toolchain builds and runs a program
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -eux
          root="$PWD/staging/slopium-$VERSION-x86_64-linux"
          work="$(mktemp -d)"
          cd "$work"
          "$root/bin/slopium" new hello
          cd hello
          output="$("$root/bin/slopium" run)"
          echo "$output"
          echo "$output" | grep -q .

      - name: checksums
        run: sha256sum "$ARCHIVE" > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            *.tar.gz
            SHA256SUMS
          if-no-files-found: error

  publish:
    needs: [verify, suite, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The whole history and every tag: the notes are a walk from the previous
      # tag to this one, and a shallow clone has neither end of it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: the release notes are what was merged, and then why
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          # One line per pull request, because a merge commit's subject is the
          # pull request's title and `--first-parent` walks nothing else
          # (`D-131`). A title nobody thought about is published verbatim,
          # which is the point of generating this half rather than writing it.
          # The release commit is dropped: it is the bookkeeping that made this
          # tag, not something the tag delivers.
          previous="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            range="$previous..$TAG"
          else
            range="$TAG"
          fi
          {
            echo "## What changed"
            echo
            git log --first-parent --reverse --format='- %s' \
              --invert-grep --grep='^chore(release): ' "$range"
            echo
            echo "## Why"
            echo
            # The changelog says what a user would notice and why it was worth
            # doing, which no subject line can carry. It is the half a person
            # writes, under the half a machine writes.
            awk -v version="$VERSION" '
              $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 { inside = 1; next }
              /^## \[/ { inside = 0 }
              inside { print }
            ' CHANGELOG.md | sed -e '/./,$!d'
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog**: https://github.com/$REPOSITORY/compare/$previous...$TAG"
            fi
          } > notes.md
          grep --quiet '^- ' notes.md ||
            { echo "the tag adds no pull request to $previous" >&2; exit 1; }
          cat notes.md

      # For a toolchain people install and run, provenance is not decoration:
      # `gh attestation verify <file> --repo keepinfov/slopium` answers where an
      # archive came from.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -eu
          flags="--draft"
          [ "$PRERELEASE" = "true" ] && flags="$flags --prerelease"
          # shellcheck disable=SC2086
          gh release create "$TAG" $flags \
            --title "slopium $VERSION" \
            --notes-file notes.md \
            dist/*.tar.gz dist/SHA256SUMS

name: Proposal
description: Something the language or the toolchain should be able to do
labels: [proposal]
body:
  - type: markdown
    attributes:
      value: |
        The language freezes at v0.10, after which adding stays compatible and
        changing does not. A proposal that costs a keyword, a form, an
        interface or an ABI row is worth arguing here before it is written.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What cannot be expressed, or can only be expressed badly.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How it is written today
      description: The workaround, as code.
      render: lisp

  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: >
        What the language or the toolchain would do instead, as concretely as
        you can put it.
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: What it costs
      description: >
        A keyword, a form, a diagnostic, an ABI row, a runtime symbol, a
        manifest key — whatever it claims that cannot be given back later.
